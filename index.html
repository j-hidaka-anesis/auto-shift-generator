<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シフト自動生成ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/japanese-holidays@latest/lib/japanese-holidays.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
    .custom-scrollbar::-webkit-scrollbar { height: 10px; width: 10px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .col-hl { filter: brightness(0.85); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-2 md:p-4">

  <div class="w-full mx-auto space-y-4 relative">

    <!-- Header -->
    <header class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 items-center">
      <div class="col-span-1">
        <h1 class="text-xl md:text-2xl font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="calendar" class="w-6 h-6 text-indigo-600"></i>
          シフト自動生成ツール
        </h1>
      </div>

      <div class="col-span-1 flex justify-center">
        <div class="flex items-stretch gap-2">
          <div class="relative flex">
            <div class="flex items-center gap-4 bg-slate-50 p-3 rounded-2xl border border-slate-100">
              <button id="btn-prev-month" class="p-2 hover:bg-white rounded-xl transition-colors shadow-sm border border-transparent hover:border-slate-200 flex flex-col items-center justify-center gap-1">
                <i data-lucide="chevron-left" class="w-6 h-6 text-slate-600"></i>
                <span class="text-[9px] md:text-[10px] font-bold text-slate-500 leading-none">先月</span>
              </button>
              <h2 id="month-display" class="text-xl md:text-2xl font-black min-w-[160px] py-1.5 px-2 rounded-xl text-center text-slate-800 cursor-pointer hover:bg-slate-200 hover:text-indigo-700 transition-colors" title="月を直接選択"></h2>
              <button id="btn-next-month" class="p-2 hover:bg-white rounded-xl transition-colors shadow-sm border border-transparent hover:border-slate-200 flex flex-col items-center justify-center gap-1">
                <i data-lucide="chevron-right" class="w-6 h-6 text-slate-600"></i>
                <span class="text-[9px] md:text-[10px] font-bold text-slate-500 leading-none">翌月</span>
              </button>
            </div>

            <!-- 月選択ポップアップ -->
            <div id="month-picker-popup" class="absolute top-[calc(100%+8px)] left-1/2 -translate-x-1/2 w-[280px] bg-white rounded-2xl shadow-xl border border-slate-200 z-[100] hidden opacity-0 transition-all duration-200 p-4 transform origin-top -translate-y-2">
              <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-100">
                <button data-year-delta="-1" class="p-1.5 hover:bg-slate-100 rounded-lg transition-colors text-slate-500 hover:text-slate-800" title="前年"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                <div id="picker-year-display" class="font-black text-lg text-slate-800"></div>
                <button data-year-delta="1" class="p-1.5 hover:bg-slate-100 rounded-lg transition-colors text-slate-500 hover:text-slate-800" title="翌年"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
              </div>
              <div id="month-picker-grid" class="grid grid-cols-3 gap-2"></div>
            </div>
          </div>
          <button id="btn-current-month" class="aspect-square bg-white border border-slate-200 rounded-2xl hover:bg-slate-50 transition-colors shadow-sm flex flex-col items-center justify-center gap-1.5 text-slate-600 shrink-0" title="今月に戻る">
            <i data-lucide="calendar-check" class="w-5 h-5 md:w-6 md:h-6"></i>
            <span class="text-[10px] md:text-xs font-bold leading-none">今月</span>
          </button>
        </div>
      </div>

      <div class="col-span-1 flex items-center md:justify-end gap-3">
        <button id="btn-violations" class="hidden px-3 py-2 rounded-lg font-bold flex items-center justify-center gap-1.5 text-red-600 bg-red-50 border border-red-200 hover:bg-red-100 transition-all text-sm shrink-0" title="直近の生成結果のチェック">
          <i data-lucide="alert-triangle" class="w-4 h-4"></i> <span id="btn-violations-count"></span>
        </button>

        <button id="btn-clear" class="px-4 py-2 rounded-lg font-bold flex items-center justify-center gap-2 text-slate-600 bg-white border border-slate-200 hover:bg-slate-50 transition-all text-sm shrink-0" title="自動生成したシフトをクリア">
          <i data-lucide="trash-2" class="w-4 h-4"></i> クリア

        <button id="btn-generate" class="px-4 py-2 rounded-lg font-bold flex items-center justify-center gap-2 text-white bg-indigo-600 hover:bg-indigo-700 hover:shadow-md hover:shadow-indigo-200 transition-all text-sm shrink-0 disabled:opacity-70 disabled:cursor-wait">
          <span id="btn-generate-content" class="flex items-center gap-1.5">
            <i data-lucide="play" class="w-4 h-4"></i> シフト生成
          </span>
        </button>
      </div>
    </header>

    <!-- Settings Bar -->
    <div class="flex flex-row flex-wrap items-center gap-3">
      <button id="btn-open-req" class="bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-100 flex items-center gap-2 text-sm hover:bg-slate-50 transition-colors text-slate-700 font-semibold shrink-0">
        <i data-lucide="settings-2" class="w-4 h-4 text-indigo-500"></i> シフト生成の設定
      </button>
      <button id="btn-open-staff" class="bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-100 flex items-center gap-2 text-sm hover:bg-slate-50 transition-colors text-slate-600 font-semibold shrink-0">
        <i data-lucide="sliders-horizontal" class="w-4 h-4"></i> 社員設定

    </div>

    <div id="table-container" class="flex-1"></div>
  </div>

    <div class="font-semibold flex items-center gap-1.5 text-slate-700 border-r pr-4 border-slate-200 shrink-0">
      <i data-lucide="users" class="w-4 h-4 text-slate-400"></i>
      社員追加

    <div class="flex items-center gap-2">
      <input id="input-staff-name" type="text" placeholder="名前" class="w-24 p-1 border border-slate-200 rounded focus:ring-2 focus:ring-indigo-500 outline-none text-xs">
      <select id="input-staff-type" class="p-1 border border-slate-200 rounded text-xs bg-white outline-none focus:ring-2 focus:ring-indigo-500 w-28"></select>
      <select id="input-staff-group" class="p-1 border border-slate-200 rounded text-xs bg-white outline-none focus:ring-2 focus:ring-indigo-500 w-24"></select>
      <button id="btn-add-staff" class="bg-slate-900 text-white p-1 rounded hover:bg-slate-800 transition-colors flex justify-center items-center" title="追加">
        <i data-lucide="user-plus" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- Shift Requirements Modal -->
  <div id="shift-req-modal" class="fixed inset-0 bg-slate-900/50 z-50 hidden flex justify-center items-start pt-10 md:pt-20 px-4 opacity-0 transition-opacity duration-200">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg flex flex-col overflow-hidden transform scale-95 transition-transform duration-200" id="shift-req-modal-panel">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h2 class="font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="settings-2" class="w-5 h-5 text-indigo-600"></i>

      <div class="p-4 border-t border-slate-100 bg-white flex justify-end">

      </div>
    </div>
  </div>

  <!-- Staff Settings Modal -->
  <div id="staff-modal" class="fixed inset-0 bg-slate-900/50 z-50 hidden flex justify-center items-start pt-10 md:pt-20 px-4 opacity-0 transition-opacity duration-200">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl flex flex-col overflow-hidden transform scale-95 transition-transform duration-200" id="staff-modal-panel">

          <i data-lucide="users-cog" class="w-5 h-5 text-indigo-600"></i>
          社員設定

        <button data-close-modal="staff-modal" class="p-1 text-slate-400 hover:text-slate-600 hover:bg-slate-200 rounded-lg transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-4 border-b border-slate-100 bg-white">
        <h3 class="font-bold text-slate-700 mb-2 flex items-center gap-2 text-sm">
          <i data-lucide="folder-cog" class="w-4 h-4 text-slate-500"></i> チーム名の管理（編集・追加・削除）

        <div id="group-management-content" class="space-y-2"></div>
      </div>

      <div class="p-4 border-t border-slate-100 bg-white flex justify-end">
        <button data-close-modal="staff-modal" class="px-6 py-2 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-colors shadow-sm">完了</button>

  <!-- Night Shift Modal -->

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm flex flex-col overflow-hidden transform scale-95 transition-transform duration-200" id="night-shift-modal-panel">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h2 class="font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="moon" class="w-5 h-5 text-indigo-600"></i>
          夜間担当の周期設定
        </h2>
        <button data-close-modal="night-shift-modal" class="p-1 text-slate-400 hover:text-slate-600 hover:bg-slate-200 rounded-lg transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-5 space-y-4">
        <p class="text-sm text-slate-600 font-medium leading-relaxed" id="night-shift-modal-desc"></p>
        <select id="night-shift-cycle-select" class="w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-slate-700 bg-slate-50 cursor-pointer">
          <option value="2">2日に1回</option>
          <option value="3">3日に1回</option>
        </select>
        <div class="flex gap-3 mt-4 pt-2">
          <button id="btn-night-clear" class="flex-1 py-2.5 bg-white text-red-500 font-bold rounded-xl hover:bg-red-50 transition-colors shadow-sm border border-red-200 text-sm">
            クリア<br><span class="text-[10px] font-normal">（印を消す）</span>
          </button>
          <button id="btn-night-save" class="flex-1 py-2.5 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-colors shadow-sm text-sm flex items-center justify-center">設定を保存</button>
        </div>
      </div>

  <!-- Color Picker Modal -->
  <div id="color-picker-modal" class="fixed inset-0 bg-slate-900/50 z-[70] hidden flex justify-center items-center px-4 opacity-0 transition-opacity duration-200">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-xs flex flex-col overflow-hidden transform scale-95 transition-transform duration-200" id="color-picker-modal-panel">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h2 class="font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="palette" class="w-5 h-5 text-indigo-600"></i>
          <span id="color-picker-title">色の選択</span>
        </h2>
        <button data-close-modal="color-picker-modal" class="p-1 text-slate-400 hover:text-slate-600 hover:bg-slate-200 rounded-lg transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-5 space-y-4">
        <div id="color-palette" class="grid grid-cols-4 gap-3 place-items-center"></div>
        <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between">
          <span class="text-[11px] text-slate-500 font-bold flex items-center gap-1"><i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> 自由に色を作る</span>
          <div class="flex items-center gap-2">
            <input type="color" id="color-picker-input" class="w-7 h-7 rounded cursor-pointer border-0 p-0 bg-transparent" value="#ffcccc">
            <button id="btn-color-save" class="px-3 py-1 bg-slate-800 text-white font-bold rounded hover:bg-slate-700 transition-colors shadow-sm text-xs">決定</button>
          </div>
        </div>
        <div class="mt-2 pt-2 border-t border-slate-100">
          <button id="btn-color-clear" class="w-full py-2.5 bg-white text-red-500 font-bold rounded-xl hover:bg-red-50 transition-colors shadow-sm border border-red-200 text-sm flex items-center justify-center gap-2">
            <i data-lucide="eraser" class="w-4 h-4"></i> 色を消す（クリア）
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Generation Result Modal -->
  <div id="result-modal" class="fixed inset-0 bg-slate-900/50 z-[70] hidden flex justify-center items-start pt-10 md:pt-20 px-4 opacity-0 transition-opacity duration-200">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg flex flex-col overflow-hidden transform scale-95 transition-transform duration-200" id="result-modal-panel">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-red-50">
        <h2 class="font-bold text-red-700 flex items-center gap-2">
          <i data-lucide="alert-triangle" class="w-5 h-5"></i>
          <span id="result-modal-title">守れなかった条件</span>
        </h2>
        <button data-close-modal="result-modal" class="p-1 text-slate-400 hover:text-slate-600 hover:bg-slate-200 rounded-lg transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-5 overflow-y-auto custom-scrollbar max-h-[60vh] space-y-4">
        <p class="text-xs text-slate-500 leading-relaxed">
          2000通り試した中で最も条件に近いシフトを表示しています。以下の条件は満たせませんでした。<br>
          希望休・固定シフト・人数設定を見直して再生成するか、手動で調整してください。
        </p>
        <div id="result-modal-list" class="space-y-3"></div>
      </div>
      <div class="p-4 border-t border-slate-100 bg-white flex justify-end">
        <button data-close-modal="result-modal" class="px-6 py-2 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-colors shadow-sm">閉じる</button>
      </div>
    </div>

  <!-- Shift Picker Popover (全セル共通の1つだけ) -->
  <div id="shift-picker" class="fixed z-[90] hidden bg-white rounded-xl shadow-xl border border-slate-200 p-2 w-[176px]">
    <div id="shift-picker-title" class="text-[10px] text-slate-500 font-bold mb-1.5 px-0.5 truncate"></div>
    <div id="shift-picker-presets" class="grid grid-cols-3 gap-1"></div>
    <div class="mt-1.5 pt-1.5 border-t border-slate-100 flex flex-col gap-0.5 text-xs">
      <button data-picker="custom" class="text-left px-2 py-1 rounded hover:bg-slate-100 text-slate-700 flex items-center gap-1.5"><i data-lucide="pencil" class="w-3.5 h-3.5 text-slate-400"></i>自由入力...</button>
      <button data-picker="color" class="text-left px-2 py-1 rounded hover:bg-slate-100 text-slate-700 flex items-center gap-1.5"><i data-lucide="palette" class="w-3.5 h-3.5 text-slate-400"></i>セルの色を変更...</button>
      <button data-picker="clear" class="text-left px-2 py-1 rounded hover:bg-red-50 text-red-500 flex items-center gap-1.5"><i data-lucide="eraser" class="w-3.5 h-3.5"></i>手動入力を消す</button>
    </div>
  </div>

  <!-- Staff Summary Popup -->
  <div id="staff-summary-popup" class="fixed z-[100] hidden bg-white rounded-xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.15)] border border-slate-200 p-3 w-32 transition-opacity duration-150 opacity-0 pointer-events-none text-slate-800
  after:content-[''] after:absolute after:top-1/2 after:-right-[9px] after:-translate-y-1/2 after:border-[5px] after:border-transparent after:border-l-slate-200
  before:content-[''] before:absolute before:top-1/2 before:-right-[8px] before:-translate-y-1/2 before:border-[5px] before:border-transparent before:border-l-white">
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[200] hidden bg-slate-900 text-white text-sm font-bold px-4 py-2.5 rounded-xl shadow-lg"></div>

  <!--
    ============================================================
    シフト生成ロジック（純粋関数）
    Web Worker 内でも、メインスレッドでも同じコードを実行できるように
    実行されない text/plain として置き、JS から読み込んで使う。
    ============================================================
  -->
  <script type="text/plain" id="generator-src">
    // ---- ルール（勤務条件）----
    const RULES = {
      trials: 2000,              // 試行回数
      offAttempts: 30,           // 1人あたりの休み配置リトライ回数
      maxConsecutive: 5,         // 最大連勤数
      sogoMaxWorkIn7: 5,         // 総合: 任意の7日間での最大出勤日数
      generalMonthlyOff: 10,     // 一般: 月の公休日数
      generalWeeklyOffMin: 2,    // 一般: 週の休み下限
      generalWeeklyOffMax: 3,    // 一般: 週の休み上限
      maxAdjustLoops: 5,         // 上限人数調整のループ回数
      nightB: {                  // 夜間担当日のB回数（月の目標範囲）
        '総合': [1, 3],
        '一般(夜間あり)': [1, 2],
      },
    };

    // ---- ペナルティの重み（大きいほど優先して守る）----
    const PENALTY = {
      consecutive: 2000000000,     // 6連勤以上（絶対）
      generalRestMismatch: 1000000000, // 一般の月休日数ズレ（絶対）
      followUp: 500000000,         // 「1人にしない」違反（絶対）
      groupMinMax: 100000000,      // チーム人数の上限・下限（絶対）
      weekendExcess: 1000000,      // 土日祝の目標超過（2乗）
      sogoWeekly: 100000,          // 総合: 週6日以上出勤
      sogoWindow: 100000,          // 総合: 任意の7日間で6日以上出勤
      nightNoSogoB: 50000,         // 夜間担当日に総合のBがいない
      reqShortage: 10000,          // 目標内訳人数の不足
      generalWeekly: 5000,         // 一般: 週の休み数
      leveling: 3000,              // 週内の出勤人数のばらつき
      nightBUnder: { '総合': 3000, '一般(夜間あり)': 2000 },
      nightBOver: 3000,
      reverseOrder: 2000,          // シフト時間の逆行（B→Aなど）
      sogoRestMismatch: 1000,      // 総合の月休日数ズレ
      offPreference: 100,          // 休みの傾向（単発/連続）
      forwardOrder: 50,            // 順行変化（できれば同じシフト）
      weekdayExcess: 1,            // 平日の目標超過（2乗）
    };

    const SHIFT_TYPES = ['A', '10', '11', 'B'];               // 時間順
    const SHIFT_ORDER = { 'A': 0, '10': 1, '11': 2, 'B': 3 };
    const FORWARD_SHIFTS = { 'A': ['10', '11', 'B'], '10': ['11', 'B'], '11': ['B'], 'B': [] };
    const SURPLUS_SHIFTS = { 'A': ['A'], '10': ['10', '11'], '11': ['11', 'B'], 'B': ['B'] };
    const FALLBACK_SHIFTS = { 'A': ['A', '10'], '10': ['10', '11'], '11': ['11', 'B'], 'B': ['B'] };

    const isOffVal = v => v === '休' || v === '有休';
    const isWorkVal = v => !!v && !isOffVal(v);
    const isShiftType = v => SHIFT_ORDER[v] !== undefined;
    const randInt = n => Math.floor(Math.random() * n);
    const pickRandom = arr => arr[randInt(arr.length)];
    const dateLabel = ds => `${Number(ds.slice(5, 7))}/${Number(ds.slice(8, 10))}`;
    const groupLabel = g => (g === '' ? 'なし' : g);
    const maxOf = r => (r.max === null || r.max === undefined || r.max === '') ? Infinity : Number(r.max);
    const reqTotalOf = r => SHIFT_TYPES.reduce((sum, t) => sum + (Number(r[t]) || 0), 0);

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = randInt(i + 1);
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function maxWindowSum(flags, size) {
      if (flags.length < size) return 0;
      let sum = 0;
      for (let i = 0; i < size; i++) sum += flags[i] ? 1 : 0;
      let max = sum;
      for (let i = size; i < flags.length; i++) {
        sum += (flags[i] ? 1 : 0) - (flags[i - size] ? 1 : 0);
        if (sum > max) max = sum;
      }
      return max;
    }

    /**
     * input = {
     *   days: [{ dateStr, dayOfWeek, weekNumber, isWeekend, isNightShiftDay }],
     *   staffs: [{ id, name, type, group, needsFollowUp, offPreference,
     *              manual: [日ごとの手動入力 or null], prev: [前月末の勤務('休'/シフト/null)] }],
     *   shiftReq, firstDayOfWeek, weekendsOnlyCount
     * }
     * 戻り値: { shift: { dateStr: { staffId: 値 } }, violations: [{ type, text }], penalty }
     */
    function runGenerator(input, onProgress) {
      const { days, staffs, shiftReq, firstDayOfWeek, weekendsOnlyCount } = input;
      const D = days.length;
      const S = staffs.length;
      if (S === 0) return { shift: {}, violations: [], penalty: 0 };

      // ---- 事前計算（試行ごとに変わらないもの）----
      const isGroupActive = g => !!shiftReq[g] && shiftReq[g].enabled !== false;
      const groupNames = Object.keys(shiftReq);
      const activeGroups = groupNames.filter(isGroupActive);
      const assignOrder = activeGroups.filter(g => g !== '').concat(activeGroups.includes('') ? [''] : []);
      const members = {};
      groupNames.forEach(g => { members[g] = []; });
      staffs.forEach((s, si) => { if (members[s.group]) members[s.group].push(si); });
      const inactiveStaff = [];
      staffs.forEach((s, si) => { if (!isGroupActive(s.group)) inactiveStaff.push(si); });
      const reqOf = (g, d) => (days[d].isWeekend ? shiftReq[g].weekend : shiftReq[g].weekday);

      const weeks = [];
      days.forEach((day, d) => {
        if (!weeks[day.weekNumber]) weeks[day.weekNumber] = [];
        weeks[day.weekNumber].push(d);
      });
      const weekendOnlyInWeek = weeks.map(w => w.filter(d => days[d].dayOfWeek === 0 || days[d].dayOfWeek === 6).length);
      const hasNightDay = days.some(d => d.isNightShiftDay);

      const pre = staffs.map(s => {
        const prevWork = s.prev.map(isWorkVal);
        let prevConsecutive = 0;
        let prevPenType = null;
        s.prev.forEach(v => {
          if (isWorkVal(v)) {
            prevConsecutive++;
            if (isShiftType(v)) prevPenType = v;
          } else {
            prevConsecutive = 0;
            prevPenType = null;
          }
        });
        const last = s.prev[s.prev.length - 1];
        const emptyDays = [];
        let manualOffCount = 0;
        let manualPaidCount = 0;
        s.manual.forEach((v, d) => {
          if (!v) emptyDays.push(d);
          else if (v === '休') manualOffCount++;
          else if (v === '有休') manualPaidCount++;
        });
        return {
          isSogo: s.type === '総合',
          prevConsecutive,
          prevPenType,
          prevLastType: isShiftType(last) ? last : null,
          recent6: prevWork.slice(-6),
          week0PrevWork: firstDayOfWeek > 0 ? prevWork.slice(-firstDayOfWeek).filter(Boolean).length : 0,
          emptyDays,
          manualOffCount,
          manualPaidCount,
        };
      });

      // shift[d][si]: null(手動入力あり) / '休' / 'WORK' / 'A' / '10' / '11' / 'B'
      let shift = null;
      const actualAt = (d, si) => staffs[si].manual[d] || shift[d][si];
      const isWorkingAt = (d, si) => isWorkVal(actualAt(d, si));
      const workingCount = (g, d) => {
        let c = 0;
        for (const si of members[g]) if (isWorkingAt(d, si)) c++;
        return c;
      };

      // ---- 1. 休みの配置（スタッフごと）----
      function pickOffs(si) {
        const s = staffs[si];
        const p = pre[si];
        let best = null;
        let bestScore = Infinity;

        for (let attempt = 0; attempt < RULES.offAttempts; attempt++) {
          const offs = new Set();
          if (p.isSogo) {
            weeks.forEach((w, wi) => {
              const empty = w.filter(d => !s.manual[d]);
              const manualOff = w.filter(d => s.manual[d] === '休').length;
              const n = Math.min(Math.max(weekendOnlyInWeek[wi] - manualOff, 0), empty.length);
              shuffle(empty).slice(0, n).forEach(d => offs.add(d));
            });
          } else {
            const need = Math.max(0, RULES.generalMonthlyOff - p.manualOffCount);
            const picked = [];
            weeks.forEach(w => {
              const empty = shuffle(w.filter(d => !s.manual[d]));
              picked.push(...empty.slice(0, 2));
            });
            while (picked.length > need) picked.splice(randInt(picked.length), 1);
            const pickedSet = new Set(picked);
            const rest = shuffle(p.emptyDays.filter(d => !pickedSet.has(d)));
            while (picked.length < need && rest.length > 0) picked.push(rest.pop());
            picked.forEach(d => offs.add(d));
          }

          // 連勤・7日間出勤の事前チェック
          const status = s.manual.map((v, d) => !(isOffVal(v) || offs.has(d))); // true = 出勤
          let cons = p.prevConsecutive;
          let maxCons = cons;
          status.forEach(w => {
            if (w) { cons++; if (cons > maxCons) maxCons = cons; } else cons = 0;
          });
          const maxW7 = p.isSogo ? maxWindowSum(p.recent6.concat(status), 7) : 0;

          const score = maxCons + maxW7;
          if (score < bestScore) { bestScore = score; best = offs; }
          if (maxCons <= RULES.maxConsecutive && (!p.isSogo || maxW7 <= RULES.sogoMaxWorkIn7)) break;
        }
        return best;
      }

      // ---- 1.5 チームの上限人数を超えないように振り替え ----
      function enforceMax() {
        for (let loop = 0; loop < RULES.maxAdjustLoops; loop++) {
          let changed = false;
          for (let d = 0; d < D; d++) {
            for (const g of activeGroups) {
              const max = maxOf(reqOf(g, d));
              if (max === Infinity) continue;
              let total = workingCount(g, d);
              if (total <= max) continue;

              const autoWorkers = shuffle(members[g].filter(si => !staffs[si].manual[d] && shift[d][si] === 'WORK'));
              while (total > max && autoWorkers.length > 0) {
                changed = true;
                const si = autoWorkers.pop();
                shift[d][si] = '休';

                // 休日数の帳尻を合わせるため、上限に余裕がある別の休みを出勤にする
                const cands = [];
                for (let d2 = 0; d2 < D; d2++) {
                  if (d2 === d || staffs[si].manual[d2] || shift[d2][si] !== '休') continue;
                  if (workingCount(g, d2) < maxOf(reqOf(g, d2))) cands.push(d2);
                }
                if (cands.length > 0) {
                  const weekdays = cands.filter(x => !days[x].isWeekend);
                  shift[pickRandom(weekdays.length > 0 ? weekdays : cands)][si] = 'WORK';
                  total--;
                } else {
                  shift[d][si] = 'WORK'; // 振替先なし → 戻す（ペナルティで評価）
                }
              }
            }
          }
          if (!changed) break;
        }
      }

      // ---- 2. 出勤者に A/10/11/B を割り当て ----
      function assignShiftTypes() {
        for (let d = 0; d < D; d++) {
          const prevType = si => {
            if (d === 0) return pre[si].prevLastType;
            const m = staffs[si].manual[d - 1];
            if (isShiftType(m)) return m;
            const a = shift[d - 1][si];
            return isShiftType(a) ? a : null;
          };

          for (const g of assignOrder) {
            const r = reqOf(g, d);
            const need = {};
            SHIFT_TYPES.forEach(t => { need[t] = Number(r[t]) || 0; });
            members[g].forEach(si => {
              const m = staffs[si].manual[d];
              if (need[m] !== undefined) need[m]--;
            });
            const take = (si, t) => {
              if (need[t] > 0) { shift[d][si] = t; need[t]--; return true; }
              return false;
            };

            let rem = shuffle(members[g].filter(si => shift[d][si] === 'WORK'));
            // (1) 前日と同じシフト
            rem = rem.filter(si => { const p = prevType(si); return !(p && take(si, p)); });
            // (2) 順行変化（A→10→11→B）
            rem = rem.filter(si => { const p = prevType(si); return !p || !FORWARD_SHIFTS[p].some(t => take(si, t)); });
            // (3) 前日休みの人
            rem = rem.filter(si => prevType(si) || !SHIFT_TYPES.some(t => take(si, t)));
            // (4) 残りの枠を埋める／余りはなるべく逆行しないように
            rem.forEach(si => {
              if (SHIFT_TYPES.some(t => take(si, t))) return;
              const p = prevType(si);
              shift[d][si] = pickRandom(p ? SURPLUS_SHIFTS[p] : SHIFT_TYPES);
            });
          }

          // 設定が無効なチームのスタッフ
          inactiveStaff.forEach(si => {
            if (shift[d][si] !== 'WORK') return;
            const p = prevType(si);
            shift[d][si] = pickRandom(p ? FALLBACK_SHIFTS[p] : SHIFT_TYPES);
          });

          // 夜間担当日は総合のスタッフが最低1人B
          if (days[d].isNightShiftDay) {
            const hasSogoB = staffs.some((s, si) => s.type === '総合' && actualAt(d, si) === 'B');
            if (!hasSogoB) {
              const working = [];
              staffs.forEach((s, si) => {
                if (s.type === '総合' && !s.manual[d] && shift[d][si] !== '休') working.push(si);
              });
              if (working.length > 0) {
                const preferred = working.filter(si => !staffs[si].needsFollowUp);
                shift[d][pickRandom(preferred.length > 0 ? preferred : working)] = 'B';
              }
            }
          }
        }
      }

      // ---- 3. 評価（ペナルティ計算）。log を渡すと必須条件の違反を記録 ----
      function evaluate(log) {
        let pen = 0;
        const add = (type, text) => { if (log) log.push({ type, text }); };

        // 3-1. スタッフごとの条件
        staffs.forEach((s, si) => {
          const p = pre[si];
          let cons = p.prevConsecutive;
          let prevT = p.prevPenType;
          let nightB = 0;
          let workTotal = 0;
          const work = new Array(D);

          for (let d = 0; d < D; d++) {
            const v = actualAt(d, si);
            const w = isWorkVal(v);
            work[d] = w;
            if (w) {
              workTotal++;
              if (days[d].isNightShiftDay && v === 'B') nightB++;
              cons++;
              if (cons > RULES.maxConsecutive) {
                pen += PENALTY.consecutive * (cons - RULES.maxConsecutive);
                if (cons === RULES.maxConsecutive + 1) add('連勤', `${s.name}：${dateLabel(days[d].dateStr)} で${cons}連勤以上`);
              }
              if (prevT && isShiftType(v)) {
                const a = SHIFT_ORDER[prevT];
                const b = SHIFT_ORDER[v];
                if (b < a) pen += PENALTY.reverseOrder;
                else if (b > a) pen += PENALTY.forwardOrder;
              }
              prevT = isShiftType(v) ? v : null;
            } else {
              cons = 0;
              prevT = null;
            }
          }

          // 週ごとの休み・出勤日数
          weeks.forEach((w, wi) => {
            let daysCount = w.length;
            let workCnt = 0;
            w.forEach(d => { if (work[d]) workCnt++; });
            let offCnt = daysCount - workCnt;
            if (wi === 0 && firstDayOfWeek > 0) {
              daysCount += firstDayOfWeek;
              workCnt += p.week0PrevWork;
              offCnt += firstDayOfWeek - p.week0PrevWork;
            }
            if (!p.isSogo) {
              if (daysCount >= 4) {
                if (offCnt < RULES.generalWeeklyOffMin) pen += PENALTY.generalWeekly * (RULES.generalWeeklyOffMin - offCnt);
                if (offCnt > RULES.generalWeeklyOffMax) pen += PENALTY.generalWeekly * (offCnt - RULES.generalWeeklyOffMax);
              }
            } else if (workCnt > RULES.sogoMaxWorkIn7) {
              pen += PENALTY.sogoWeekly * (workCnt - RULES.sogoMaxWorkIn7);
            }
          });

          // 総合: 任意の7日間（前月末6日を含む）
          if (p.isSogo) {
            const comb = p.recent6.concat(work);
            const offset = p.recent6.length;
            let sum = 0;
            let reported = false;
            for (let i = 0; i < comb.length; i++) {
              sum += comb[i] ? 1 : 0;
              if (i >= 7) sum -= comb[i - 7] ? 1 : 0;
              if (i >= 6 && sum > RULES.sogoMaxWorkIn7) {
                pen += PENALTY.sogoWindow * (sum - RULES.sogoMaxWorkIn7);
                if (!reported) {
                  reported = true;
                  add('週休2日', `${s.name}：${dateLabel(days[i - offset].dateStr)} までの7日間で${sum}日出勤`);
                }
              }
            }
          }

          // 夜間担当日のB回数
          const nb = RULES.nightB[s.type];
          if (nb && hasNightDay) {
            if (nightB < nb[0]) pen += PENALTY.nightBUnder[s.type] * (nb[0] - nightB);
            else if (nightB > nb[1]) pen += PENALTY.nightBOver * (nightB - nb[1]);
          }

          // 休みの傾向
          if (s.offPreference) {
            let run = 0;
            const flush = () => {
              if (run === 0) return;
              if (s.offPreference === '単発' && run >= 2) pen += PENALTY.offPreference * (run - 1);
              if (s.offPreference === '連続' && run === 1) pen += PENALTY.offPreference;
              run = 0;
            };
            work.forEach(w => { if (!w) run++; else flush(); });
            flush();
          }

          // 規定の休日数（公休 + 有休）
          const target = (p.isSogo ? weekendsOnlyCount : RULES.generalMonthlyOff) + p.manualPaidCount;
          const rests = D - workTotal;
          if (rests !== target) {
            if (p.isSogo) {
              pen += PENALTY.sogoRestMismatch * Math.abs(target - rests);
            } else {
              pen += PENALTY.generalRestMismatch * Math.abs(target - rests);
              add('休日数', `${s.name}：休み${rests}日（必要 ${target}日）`);
            }
          }
        });

        // 3-2. 日ごと・チームごとの条件
        const counts = {};
        activeGroups.forEach(g => { counts[g] = new Array(D); });

        for (let d = 0; d < D; d++) {
          const ds = dateLabel(days[d].dateStr);
          for (const g of activeGroups) {
            const r = reqOf(g, d);
            let cnt = 0;
            const follow = {};
            for (const si of members[g]) {
              const v = actualAt(d, si);
              if (!isWorkVal(v)) continue;
              cnt++;
              if (isShiftType(v)) {
                if (!follow[v]) follow[v] = { needs: false, independent: false };
                if (staffs[si].needsFollowUp) follow[v].needs = true;
                else follow[v].independent = true;
              }
            }
            counts[g][d] = cnt;

            const max = maxOf(r);
            const min = Number(r.min) || 0;
            if (cnt > max) {
              pen += (cnt - max) * PENALTY.groupMinMax;
              add('人数上限', `${ds} ${groupLabel(g)}：${cnt}人（上限 ${max}人）`);
            }
            if (cnt < min) {
              pen += (min - cnt) * PENALTY.groupMinMax;
              add('人数下限', `${ds} ${groupLabel(g)}：${cnt}人（最小 ${min}人）`);
            }

            const total = reqTotalOf(r);
            if (cnt < total) pen += (total - cnt) * PENALTY.reqShortage;
            else pen += Math.pow(cnt - total, 2) * (days[d].isWeekend ? PENALTY.weekendExcess : PENALTY.weekdayExcess);

            Object.keys(follow).forEach(t => {
              if (follow[t].needs && !follow[t].independent) {
                pen += PENALTY.followUp;
                add('1人にしない', `${ds} ${groupLabel(g)} ${t}：「1人にしない」スタッフだけの勤務`);
              }
            });
          }

          if (days[d].isNightShiftDay && !staffs.some((s, si) => s.type === '総合' && actualAt(d, si) === 'B')) {
            pen += PENALTY.nightNoSogoB;
            add('夜間', `${ds}：夜間担当日に総合のBがいません`);
          }
        }

        // 3-3. 週内の出勤人数の平準化（平日・土日祝を分けて）
        const variance = arr => {
          if (arr.length === 0) return 0;
          const avg = arr.reduce((a, b) => a + b, 0) / arr.length;
          return arr.reduce((a, b) => a + (b - avg) * (b - avg), 0);
        };
        weeks.forEach(w => {
          activeGroups.forEach(g => {
            const wd = [];
            const we = [];
            w.forEach(d => (days[d].isWeekend ? we : wd).push(counts[g][d]));
            pen += (variance(wd) + variance(we)) * PENALTY.leveling;
          });
        });

        return pen;
      }

      // ---- 試行ループ ----
      let best = null;
      let bestPen = Infinity;
      const progressStep = Math.max(1, Math.floor(RULES.trials / 50));

      for (let trial = 0; trial < RULES.trials; trial++) {
        shift = days.map(() => new Array(S).fill(null));
        staffs.forEach((s, si) => {
          const offs = pickOffs(si);
          for (let d = 0; d < D; d++) {
            if (!s.manual[d]) shift[d][si] = offs.has(d) ? '休' : 'WORK';
          }
        });
        enforceMax();
        assignShiftTypes();

        const pen = evaluate(null);
        if (pen < bestPen) {
          bestPen = pen;
          best = shift.map(row => row.slice());
        }
        if (onProgress && trial % progressStep === 0) onProgress(trial / RULES.trials);
      }

      shift = best;
      const violations = [];
      evaluate(violations);

      const out = {};
      days.forEach((day, d) => {
        const o = {};
        staffs.forEach((s, si) => { if (shift[d][si]) o[s.id] = shift[d][si]; });
        out[day.dateStr] = o;
      });
      return { shift: out, violations, penalty: bestPen };
    }
  </script>

  <script>
    // ============================================================
    // 定数
    // ============================================================
    const GEN_SRC = document.getElementById('generator-src').textContent;
    const Gen = new Function(GEN_SRC + '\nreturn { runGenerator, RULES };')();
    const RULES = Gen.RULES;

    const STORAGE_KEY = 'shift_maker_app_data';
    const DAY_NAMES = ['日', '月', '火', '水', '木', '金', '土'];
    const SHIFT_TYPES = ['A', '10', '11', 'B'];
    const OFF_TYPES = ['休', '有休'];
    const PRESET_SHIFTS = [...SHIFT_TYPES, ...OFF_TYPES];
    const STAFF_TYPES = ['総合', '一般(夜間なし)', '一般(夜間あり)'];
    const OFF_PREFERENCES = [['', 'なし'], ['単発', '単発'], ['連続', '連続']];
    const COLOR_PALETTE = [
      ['#fee2e2', '赤'], ['#ffedd5', 'オレンジ'], ['#fef9c3', '黄'], ['#dcfce7', '緑'],
      ['#cffafe', '水色'], ['#e0f2fe', '空色'], ['#dbeafe', '青'], ['#e0e7ff', '藍'],
      ['#f3e8ff', '紫'], ['#fce7f3', 'ピンク'], ['#ffe4e6', 'ローズ'], ['#f1f5f9', 'グレー'],
    ];
    const newGroupReq = () => ({
      enabled: true,
      weekday: { min: 0, max: null, 'A': 0, 'B': 0, '10': 0, '11': 0 },
      weekend: { min: 0, max: null, 'A': 0, 'B': 0, '10': 0, '11': 0 },
    });

    // テーブルの固定列
    const STICKY_L = 'sticky left-0 z-10 border-b border-r border-slate-200 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]';
    const STICKY_R1 = 'sticky right-[40px] md:right-[50px] z-10 border-b border-l border-slate-200 shadow-[-2px_0_5px_-2px_rgba(0,0,0,0.05)]';
    const STICKY_R2 = 'sticky right-0 z-10 border-b border-l border-slate-200 shadow-[-2px_0_5px_-2px_rgba(0,0,0,0.1)]';

    // ============================================================
    // 状態
    // ============================================================
    let currentDate = firstOfMonth(new Date());
    let generatedShifts = {};
    let isSummaryExpanded = true;
    let dailyMemos = {};
    let isMemoVisible = true;
    let colColors = {};
    let memoColors = {};
    let nightShiftConfig = { startDate: null, cycle: null };
    let shiftReq = {
      '': {
        enabled: false,
        weekday: { min: 0, max: null, 'A': 0, 'B': 0, '10': 0, '11': 0 },
        weekend: { min: 0, max: null, 'A': 0, 'B': 0, '10': 0, '11': 0 },
      },
    };
    let staffs = [];
    let lastViolations = {}; // monthKey -> violations（保存しない）
    let isGenerating = false;

    // ============================================================
    // ユーティリティ
    // ============================================================
    const $ = id => document.getElementById(id);
    const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC_MAP[c]);
    const pad2 = n => String(n).padStart(2, '0');
    const toDateStr = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    const parseDateStr = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
    const monthKey = (y, m) => `${y}-${pad2(m + 1)}`;
    const isOffVal = v => OFF_TYPES.includes(v);
    const isWorkVal = v => !!v && !isOffVal(v);
    const groupLabel = g => (g === '' ? 'なし' : g);
    const refreshIcons = () => lucide.createIcons();

    function firstOfMonth(d) {
      return new Date(d.getFullYear(), d.getMonth(), 1);
    }

    // 手動入力が最優先、なければ自動生成の値
    function getActualShift(staff, dateStr) {
      return staff.manualShifts[dateStr] || (generatedShifts[dateStr] && generatedShifts[dateStr][staff.id]) || null;
    }

    function isNightShiftDate(dateObj) {
      const { startDate, cycle } = nightShiftConfig;
      if (!startDate || !cycle) return false;
      const diff = Math.round((dateObj - parseDateStr(startDate)) / 86400000);
      return diff >= 0 && diff % cycle === 0;
    }

    function buildCalendarDays(year, month) {
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const days = [];
      let week = 0;
      let weekendsOnlyCount = 0;
      for (let i = 1; i <= daysInMonth; i++) {
        const dateObj = new Date(year, month, i);
        const dayOfWeek = dateObj.getDay();
        if (dayOfWeek === 0 && i !== 1) week++;
        const holidayName = (typeof JapaneseHolidays !== 'undefined' && JapaneseHolidays.isHoliday(dateObj)) || null;
        const isSatSun = dayOfWeek === 0 || dayOfWeek === 6;
        if (isSatSun) weekendsOnlyCount++;
        days.push({
          day: i,
          dateStr: toDateStr(dateObj),
          dayOfWeek,
          weekNumber: week,
          isHoliday: !!holidayName,
          holidayName,
          isWeekend: isSatSun || !!holidayName,
          isNightShiftDay: isNightShiftDate(dateObj),
        });
      }
      return { days, weekendsOnlyCount, firstDayOfWeek: new Date(year, month, 1).getDay() };
    }

    function currentCalendar() {
      return buildCalendarDays(currentDate.getFullYear(), currentDate.getMonth());
    }

    function showToast(msg, ms = 2500) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => t.classList.add('hidden'), ms);
    }

    // ============================================================
    // 保存・読み込み
    // ============================================================
    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          generatedShifts, dailyMemos, colColors, memoColors, nightShiftConfig,
          shiftReq, staffs, isSummaryExpanded, isMemoVisible,
        }));
      } catch (e) {
        console.error('データの保存に失敗しました', e);
      }
    }

    function loadData() {
      let data = null;
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) data = JSON.parse(saved);
      } catch (e) {
        console.error('データの読み込みに失敗しました', e);
      }
      if (!data) return;
      if (data.generatedShifts) generatedShifts = data.generatedShifts;
      if (data.dailyMemos) dailyMemos = data.dailyMemos;
      if (data.colColors) colColors = data.colColors;
      if (data.memoColors) memoColors = data.memoColors;
      if (data.nightShiftConfig) nightShiftConfig = data.nightShiftConfig;
      if (data.shiftReq) shiftReq = data.shiftReq;
      if (data.staffs) staffs = data.staffs;
      if (data.isSummaryExpanded !== undefined) isSummaryExpanded = data.isSummaryExpanded;
      if (data.isMemoVisible !== undefined) isMemoVisible = data.isMemoVisible;

      // 古いデータの欠けている項目を補完
      if (!shiftReq['']) shiftReq[''] = { ...newGroupReq(), enabled: false };
      staffs.forEach(s => {
        s.group = s.group || '';
        s.manualShifts = s.manualShifts || {};
        s.isCustomInput = s.isCustomInput || {};
        s.cellColors = s.cellColors || {};
        s.offPreference = s.offPreference || '';
        if (!shiftReq[s.group]) s.group = '';
      });
    }

    // データを変更したら必ずこれを呼ぶ（保存 + 再描画）
    function commit() {
      saveData();
      renderTable();
    }

    // ============================================================
    // モーダル共通
    // ============================================================
    function openModal(id) {
      const modal = $(id);
      const panel = $(id + '-panel');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        panel.classList.remove('scale-95');
      }, 10);
    }

    function closeModal(id, after) {
      const modal = $(id);
      const panel = $(id + '-panel');
      modal.classList.add('opacity-0');
      panel.classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
        if (after) after();
      }, 200);
    }

    // ============================================================
    // 月表示・月選択
    // ============================================================
    function renderMonthHeader() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      $('month-display').textContent = `${year}年 ${month + 1}月`;

      const today = new Date();
      const isCurrentMonth = year === today.getFullYear() && month === today.getMonth();
      const btn = $('btn-current-month');
      const on = ['bg-blue-50', 'border-blue-200', 'text-blue-600', 'hover:bg-blue-100'];
      const off = ['bg-white', 'border-slate-200', 'text-slate-600', 'hover:bg-slate-50'];
      btn.classList.remove(...(isCurrentMonth ? on : off));
      btn.classList.add(...(isCurrentMonth ? off : on));

      renderViolationBadge();
    }

    function setMonth(year, month) {
      currentDate = new Date(year, month, 1); // 常に1日（月末からの移動で月が飛ばないように）
      renderMonthHeader();
      renderTable();
    }

    const changeMonth = delta => setMonth(currentDate.getFullYear(), currentDate.getMonth() + delta);

    let pickerYear = currentDate.getFullYear();
    let isMonthPickerOpen = false;

    function toggleMonthPicker() {
      if (isMonthPickerOpen) { closeMonthPicker(); return; }
      pickerYear = currentDate.getFullYear();
      renderMonthPickerGrid();
      const popup = $('month-picker-popup');
      popup.classList.remove('hidden');
      setTimeout(() => popup.classList.remove('opacity-0', '-translate-y-2'), 10);
      isMonthPickerOpen = true;
    }

    function closeMonthPicker() {
      const popup = $('month-picker-popup');
      popup.classList.add('opacity-0', '-translate-y-2');
      isMonthPickerOpen = false;
      setTimeout(() => { if (!isMonthPickerOpen) popup.classList.add('hidden'); }, 200);
    }

    function renderMonthPickerGrid() {
      $('picker-year-display').textContent = `${pickerYear}年`;
      const cm = currentDate.getMonth();
      const cy = currentDate.getFullYear();
      let html = '';
      for (let i = 0; i < 12; i++) {
        const isCurrent = pickerYear === cy && i === cm;
        const cls = isCurrent
          ? 'bg-indigo-600 text-white shadow-md'
          : 'bg-slate-50 text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 border border-slate-100 hover:border-indigo-200';
        html += `<button data-month="${i}" class="py-2.5 rounded-xl font-bold transition-all text-sm ${cls}">${i + 1}月</button>`;
      }
      $('month-picker-grid').innerHTML = html;
    }

    // ============================================================
    // メインテーブル描画
    // ============================================================
    function dayHeaderCells(days, pos) {
      const posCls = pos === 'top' ? 'sticky top-0 border-b' : 'sticky bottom-0 border-t';
      return days.map(d => {
        const color = (d.dayOfWeek === 0 || d.isHoliday) ? 'bg-red-50 text-red-600'
          : d.dayOfWeek === 6 ? 'bg-blue-50 text-blue-600' : 'bg-slate-50 text-slate-700';
        const title = (d.holidayName ? esc(d.holidayName) + '&#10;' : '') + 'クリックで列の色を変更';
        return `<th data-action="col-color" data-date="${d.dateStr}" data-head="${d.dateStr}" class="${posCls} z-10 border-r border-slate-200 p-0.5 text-center transition-all duration-75 cursor-pointer hover:brightness-95 ${color}" title="${title}">
          <div class="font-bold text-[10px] md:text-xs leading-none">${d.day}</div>
          <div class="text-[8px] md:text-[9px] font-normal opacity-80 leading-none mt-0.5">${DAY_NAMES[d.dayOfWeek]}</div>
        </th>`;
      }).join('');
    }

    function sideLabel(content) {
      return `<div class="flex items-center justify-center gap-0.5 w-full h-full">${content}</div>`;
    }

    function chevron(open) {
      return `<i data-lucide="${open ? 'chevron-down' : 'chevron-right'}" class="w-3.5 h-3.5 text-slate-500"></i>`;
    }

    function staffNameCell(staff, sideCls) {
      const dot = staff.type === '総合' ? 'bg-blue-500' : 'bg-yellow-400';
      return `<td class="${sideCls} bg-white group-hover:brightness-95 transition-all duration-75 p-1 overflow-hidden">
        <div class="relative flex items-center justify-center h-full">
          <div class="flex items-center gap-0.5 relative w-full justify-center">
            <div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-1 md:w-1.5 md:h-1.5 rounded-full ${dot}"></div>
            <span class="font-medium text-slate-800 text-[9px] md:text-[11px] truncate max-w-[36px] md:max-w-[50px] inline-block ml-1 md:ml-2" title="${esc(staff.name)}">${esc(staff.name)}</span>
          </div>
        </div>
      </td>`;
    }

    function shiftFontClass(val) {
      if (PRESET_SHIFTS.includes(val)) return 'text-[13px] font-black whitespace-nowrap tracking-tighter';
      if (val.length <= 2) return 'text-xs md:text-sm whitespace-nowrap';
      if (val.length === 3) return 'text-[10px] md:text-xs whitespace-nowrap';
      return 'text-[8px] md:text-[10px] leading-tight break-all whitespace-normal';
    }

    function renderShiftCell(staff, d) {
      const manualVal = staff.manualShifts[d.dateStr];
      const autoVal = generatedShifts[d.dateStr] && generatedShifts[d.dateStr][staff.id];
      let displayVal = '';
      let textColor = '';
      let bgColor = 'bg-white';

      if (manualVal) {
        displayVal = manualVal;
        const isPreset = !staff.isCustomInput[d.dateStr] && PRESET_SHIFTS.includes(manualVal);
        textColor = isPreset ? 'text-red-600' : 'text-blue-600';
        if (isOffVal(manualVal)) bgColor = isPreset ? 'bg-red-50' : 'bg-blue-100';
      } else if (isWorkVal(autoVal)) {
        displayVal = autoVal;
        textColor = 'text-blue-600';
      } else if (autoVal === '休') {
        displayVal = '休';
        textColor = 'text-blue-600';
        bgColor = 'bg-blue-100';
      } else if (d.isWeekend) {
        bgColor = 'bg-slate-50/50';
      }

      const isNightB = d.isNightShiftDay && displayVal === 'B' && staff.type !== '一般(夜間なし)';
      if (isNightB) bgColor = 'bg-yellow-100';

      // 個別のセル色 > 列の色（手動の休/有休・夜間Bは列色の対象外）
      let customColor = staff.cellColors[d.dateStr] || '';
      if (!customColor && colColors[d.dateStr] && !isOffVal(manualVal) && !isNightB) customColor = colColors[d.dateStr];
      const style = `height:36px;${customColor ? `background-color:${esc(customColor)} !important;` : ''}`;

      return `<td data-action="cell" data-staff="${esc(staff.id)}" data-date="${d.dateStr}" class="border-b border-r border-slate-200 p-0 text-center cursor-pointer group-hover:brightness-95 hover:!brightness-[0.85] transition-all duration-75 ${bgColor}" style="${style}">
        <div class="flex items-center justify-center w-full h-full px-0.5 font-bold pointer-events-none ${textColor} ${displayVal ? shiftFontClass(displayVal) : ''} overflow-hidden">${esc(displayVal)}</div>
      </td>`;
    }

    function renderRestCell(staff, days, weekendsOnlyCount, hasGenerated) {
      let workCount = 0;
      let paidOff = 0;
      days.forEach(d => {
        const v = getActualShift(staff, d.dateStr);
        if (isWorkVal(v)) workCount++;
        if (staff.manualShifts[d.dateStr] === '有休') paidOff++;
      });
      const restCount = days.length - workCount;
      const isGeneral = staff.type !== '総合';
      const target = (isGeneral ? RULES.generalMonthlyOff : weekendsOnlyCount) + paidOff;
      let restDisplay = `${restCount}`;

      if (hasGenerated) {
        if (isGeneral && restCount !== target) {
          restDisplay = `<span class="text-red-500 font-bold" title="一般は${RULES.generalMonthlyOff}日+有休(${paidOff}日)の合計${target}日休みが必要です">${restCount}</span>`;
        } else if (!isGeneral && Math.abs(restCount - target) >= 2) {
          restDisplay = `<span class="text-orange-500 font-bold" title="総合は完全週休2日(土日と同数: ${target}日)のペースですが、少し離れています">${restCount}</span>`;
        } else if (!isGeneral && restCount !== target) {
          restDisplay = `<span class="text-slate-600 font-bold" title="総合は完全週休2日(土日と同数: ${target}日)のペースで組まれています">${restCount}</span>`;
        }
      }

      return `<td data-action="summary" data-staff="${esc(staff.id)}" class="${STICKY_R2} bg-white group-hover:brightness-95 hover:!bg-indigo-50 transition-all duration-75 p-1 text-center text-[8px] md:text-[9px] text-slate-600 cursor-pointer" title="クリックで詳しい内訳を表示">
        <span class="font-bold ${workCount > 0 ? 'text-blue-600' : ''}">${workCount}</span><span class="text-slate-300 scale-75 inline-block mx-px">/</span>${restDisplay}
      </td>`;
    }

    function renderTable() {
      const { days, weekendsOnlyCount } = currentCalendar();
      const hasGenerated = Object.keys(generatedShifts).length > 0;
      let html = `<table class="w-full border-collapse text-xs table-fixed"><thead>`;

      // -- 日付ヘッダー --
      html += `<tr>
        <th class="sticky left-0 top-0 z-20 bg-slate-100 border-b border-r border-slate-200 p-1 w-[50px] md:w-[70px] shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]"></th>
        ${dayHeaderCells(days, 'top')}
        <th class="sticky right-[40px] md:right-[50px] top-0 z-20 bg-slate-100 border-b border-l border-slate-200 p-1 w-[50px] md:w-[70px]"></th>
        <th class="sticky right-0 top-0 z-20 bg-slate-100 border-b border-l border-slate-200 p-1 w-[40px] md:w-[50px]"></th>
      </tr>`;

      // -- 夜間担当 --
      const nightLabel = `<div class="flex items-center justify-center w-full h-full">夜間</div>`;
      html += `<tr class="h-[22px]"><th class="${STICKY_L} bg-white px-1 py-0 text-center text-[9px] md:text-[10px] font-bold text-slate-600">${nightLabel}</th>`;
      days.forEach(d => {
        const bg = d.isNightShiftDay ? 'bg-yellow-100 hover:bg-yellow-200' : 'bg-white hover:bg-slate-50';
        html += `<th data-action="night" data-date="${d.dateStr}" class="border-b border-r border-slate-200 p-0 text-center text-[8px] md:text-[10px] font-bold text-slate-600 ${bg} leading-none cursor-pointer transition-colors" title="クリックして周期を設定">${d.isNightShiftDay ? '〇' : ''}</th>`;
      });
      html += `<th class="${STICKY_R1} bg-white px-1 py-0 text-center text-[9px] md:text-[10px] font-bold text-slate-600">${nightLabel}</th>
        <th class="${STICKY_R2} bg-white p-0"></th></tr>`;

      // -- メモ --
      const memoLabelL = sideLabel(`${chevron(isMemoVisible)}<span class="font-bold text-[9px] md:text-[10px] text-slate-600">メモ</span>`);
      const memoLabelR = sideLabel(`<span class="font-bold text-[9px] md:text-[10px] text-slate-600">メモ</span>${chevron(isMemoVisible)}`);
      html += `<tr class="${isMemoVisible ? 'h-10 md:h-11' : 'h-[22px]'}">
        <th data-action="toggle-memo" class="${STICKY_L} bg-slate-50 px-1 py-0 cursor-pointer hover:bg-slate-200 transition-colors" title="クリックでメモ欄を開閉">${memoLabelL}</th>`;
      days.forEach(d => {
        const color = memoColors[d.dateStr] || colColors[d.dateStr] || '';
        const style = color ? `background-color:${esc(color)} !important;` : '';
        const memo = dailyMemos[d.dateStr] || '';
        if (isMemoVisible) {
          html += `<th data-action="memo-focus" class="border-b border-r border-slate-200 p-0 relative bg-white focus-within:bg-indigo-50 focus-within:ring-1 focus-within:ring-indigo-500 focus-within:z-20 cursor-text group/memo" style="${style}">
            <button data-action="memo-color" data-date="${d.dateStr}" class="absolute top-0 right-0 p-0.5 text-slate-400 hover:text-indigo-600 opacity-60 md:opacity-0 focus:opacity-100 md:group-hover/memo:opacity-100 transition-opacity z-10 cursor-pointer" title="メモ欄の色を変更">
              <i data-lucide="palette" class="w-3 h-3"></i>
            </button>
            <div contenteditable="true" data-memo="${d.dateStr}" class="w-full h-full min-h-[40px] md:min-h-[44px] flex items-center justify-center text-center text-[8px] md:text-[10px] text-slate-700 outline-none font-normal px-0.5 leading-tight overflow-hidden whitespace-pre-wrap break-all">${esc(memo)}</div>
          </th>`;
        } else {
          const icon = memo.trim() ? `<i data-lucide="message-square-text" class="w-3 h-3 text-indigo-400"></i>` : '';
          html += `<th data-action="toggle-memo" class="border-b border-r border-slate-200 p-0 text-center cursor-pointer bg-white hover:bg-slate-50 transition-colors" style="${style}" ${memo ? `title="${esc(memo)}"` : ''}>
            <div class="flex items-center justify-center w-full h-full">${icon}</div>
          </th>`;
        }
      });
      html += `<th data-action="toggle-memo" class="${STICKY_R1} bg-slate-50 px-1 py-0 cursor-pointer hover:bg-slate-200 transition-colors" title="クリックでメモ欄を開閉">${memoLabelR}</th>
        <th class="${STICKY_R2} bg-slate-50 px-1 py-0 text-center text-[9px] md:text-[10px] font-bold text-slate-600"><div class="flex items-center justify-center w-full h-full">出/休</div></th></tr>`;

      // -- 集計（内訳）--
      if (hasGenerated) {
        html += `<tr data-action="toggle-summary" class="h-[22px] cursor-pointer hover:bg-slate-200/70 transition-colors bg-slate-100/80">
          <th class="${STICKY_L} px-1 py-0 text-[9px] md:text-[10px] font-bold text-slate-700 bg-slate-100">${sideLabel(`${chevron(isSummaryExpanded)}<span class="truncate">内訳</span>`)}</th>`;
        days.forEach(d => {
          const total = staffs.filter(s => isWorkVal(getActualShift(s, d.dateStr))).length;
          html += `<th class="border-b border-r border-slate-200 text-center text-[10px] md:text-xs font-black text-slate-700 leading-none">${total}</th>`;
        });
        html += `<th class="${STICKY_R1} px-1 py-0 text-[9px] md:text-[10px] font-bold text-slate-700 bg-slate-100">${sideLabel(`<span class="truncate">内訳</span>${chevron(isSummaryExpanded)}`)}</th>
          <th class="${STICKY_R2} bg-slate-100"></th></tr>`;

        if (isSummaryExpanded) {
          const groups = Object.keys(shiftReq).filter(g => g !== '' && shiftReq[g].enabled !== false);
          groups.forEach(g => {
            const label = `<div class="flex items-center justify-center w-full h-full truncate">${esc(g)}出勤</div>`;
            html += `<tr class="h-[22px]"><th class="${STICKY_L} bg-indigo-50 px-1 py-0 text-[9px] md:text-[10px] font-bold text-indigo-700">${label}</th>`;
            days.forEach(d => {
              const count = staffs.filter(s => s.group === g && isWorkVal(getActualShift(s, d.dateStr))).length;
              const req = d.isWeekend ? shiftReq[g].weekend : shiftReq[g].weekday;
              const max = (req.max === null || req.max === undefined || req.max === '') ? Infinity : Number(req.max);
              let cls = 'bg-indigo-50 text-indigo-700 border-slate-200';
              let title = '';
              if (count < (Number(req.min) || 0)) { cls = 'bg-red-100 text-red-700 border-red-200'; title = `最小 ${req.min}人を下回っています`; }
              else if (count > max) { cls = 'bg-orange-100 text-orange-700 border-orange-200'; title = `上限 ${max}人を超えています`; }
              html += `<th class="border-b border-r p-0 text-center text-[8px] md:text-[10px] font-bold ${cls} leading-none" ${title ? `title="${title}"` : ''}>${count}</th>`;
            });
            html += `<th class="${STICKY_R1} bg-indigo-50 px-1 py-0 text-[9px] md:text-[10px] font-bold text-indigo-700">${label}</th>
              <th class="${STICKY_R2} bg-indigo-50 p-0"></th></tr>`;
          });
        }
      }
      html += `</thead><tbody>`;

      // -- スタッフ行 --
      let currentGroup = null;
      staffs.forEach((staff, index) => {
        if (staff.group !== currentGroup && index !== 0) {
          html += `<tr class="bg-slate-200"><td class="sticky left-0 z-10 bg-slate-200 border-b border-r border-slate-300 p-0 h-1"></td>`
            + days.map(() => `<td class="bg-slate-200 border-b border-r border-slate-300 p-0 h-1"></td>`).join('')
            + `<td class="sticky right-[40px] md:right-[50px] z-10 bg-slate-200 border-b border-l border-slate-300 p-0 h-1"></td>`
            + `<td class="sticky right-0 z-10 bg-slate-200 border-b border-l border-slate-300 p-0 h-1"></td></tr>`;
        }
        currentGroup = staff.group;

        html += `<tr class="group">${staffNameCell(staff, STICKY_L)}`;
        days.forEach(d => { html += renderShiftCell(staff, d); });
        html += staffNameCell(staff, STICKY_R1);
        html += renderRestCell(staff, days, weekendsOnlyCount, hasGenerated);
        html += `</tr>`;
      });
      html += `</tbody>`;

      // -- フッター --
      html += `<tfoot><tr>
        <th class="sticky left-0 bottom-0 z-20 bg-slate-100 border-t border-r border-slate-200 p-1"></th>
        ${dayHeaderCells(days, 'bottom')}
        <th class="sticky right-[40px] md:right-[50px] bottom-0 z-20 bg-slate-100 border-t border-l border-slate-200 p-1"></th>
        <th class="sticky right-0 bottom-0 z-20 bg-slate-100 border-t border-l border-slate-200 p-1"></th>
      </tr></tfoot></table>`;

      $('table-container').innerHTML = html;
      highlightedDate = null;
      refreshIcons();
    }

    // ============================================================
    // テーブルのイベント（イベント委譲：セルごとにハンドラを付けない）
    // ============================================================
    let highlightedDate = null;

    function setColumnHighlight(dateStr) {
      if (highlightedDate === dateStr) return;
      document.querySelectorAll('[data-head].col-hl').forEach(el => el.classList.remove('col-hl'));
      highlightedDate = dateStr;
      if (dateStr) document.querySelectorAll(`[data-head="${dateStr}"]`).forEach(el => el.classList.add('col-hl'));
    }

    function setupTableEvents() {
      const container = $('table-container');

      container.addEventListener('click', e => {
        const el = e.target.closest('[data-action]');
        if (!el || !container.contains(el)) return;
        const { action, date, staff } = el.dataset;
        switch (action) {
          case 'cell': e.stopPropagation(); openShiftPicker(el, staff, date); break;
          case 'summary': e.stopPropagation(); showStaffSummary(el, staff); break;
          case 'col-color': openColorPicker({ type: 'col', dateStr: date }); break;
          case 'memo-color': e.stopPropagation(); openColorPicker({ type: 'memo', dateStr: date }); break;
          case 'night': openNightShiftModal(date); break;
          case 'toggle-memo': isMemoVisible = !isMemoVisible; commit(); break;
          case 'toggle-summary': isSummaryExpanded = !isSummaryExpanded; commit(); break;
          case 'memo-focus': {
            const div = el.querySelector('[data-memo]');
            if (div && document.activeElement !== div) div.focus();
            break;
          }
        }
      });

      container.addEventListener('mouseover', e => {
        const cell = e.target.closest('td[data-date]');
        setColumnHighlight(cell ? cell.dataset.date : null);
      });
      container.addEventListener('mouseleave', () => setColumnHighlight(null));

      container.addEventListener('focusout', e => {
        const div = e.target.closest && e.target.closest('[data-memo]');
        if (div) handleMemoChange(div.dataset.memo, div.innerText);
      });

      container.addEventListener('keydown', e => {
        const div = e.target.closest && e.target.closest('[data-memo]');
        if (!div || e.key !== 'Enter') return;
        e.preventDefault();
        if (e.altKey) document.execCommand('insertLineBreak');
        else div.blur();
      });
    }

    function handleMemoChange(dateStr, value) {
      if (value.trim() === '') delete dailyMemos[dateStr];
      else dailyMemos[dateStr] = value.replace(/\n+$/, '');
      saveData();
    }

    // ============================================================
    // シフト選択ポップオーバー（全セル共通）
    // ============================================================
    let pickerTarget = null;

    function openShiftPicker(cell, staffId, dateStr) {
      const staff = staffs.find(s => s.id === staffId);
      if (!staff) return;
      hideStaffSummary();
      pickerTarget = { staffId, dateStr };

      const current = staff.manualShifts[dateStr] || '';
      const d = parseDateStr(dateStr);
      $('shift-picker-title').textContent = `${staff.name}　${d.getMonth() + 1}/${d.getDate()}(${DAY_NAMES[d.getDay()]})`;
      $('shift-picker-presets').innerHTML = PRESET_SHIFTS.map(v => {
        const active = current === v && !staff.isCustomInput[dateStr];
        const color = isOffVal(v) ? 'text-red-600' : 'text-slate-800';
        const cls = active ? 'bg-indigo-600 text-white border-indigo-600' : `bg-slate-50 ${color} border-slate-200 hover:bg-indigo-50 hover:border-indigo-300`;
        return `<button data-picker="set" data-value="${v}" class="py-1.5 rounded-lg border font-black text-sm transition-colors ${cls}">${v}</button>`;
      }).join('');

      const picker = $('shift-picker');
      picker.classList.remove('hidden');
      const rect = cell.getBoundingClientRect();
      const pw = picker.offsetWidth;
      const ph = picker.offsetHeight;
      let left = rect.left + rect.width / 2 - pw / 2;
      let top = rect.bottom + 4;
      if (top + ph > window.innerHeight - 8) top = rect.top - ph - 4;
      left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
      top = Math.max(8, top);
      picker.style.left = `${left}px`;
      picker.style.top = `${top}px`;
    }

    function closeShiftPicker() {
      $('shift-picker').classList.add('hidden');
      pickerTarget = null;
    }

    function setManualShift(staff, dateStr, value, isCustom) {
      if (!value) {
        delete staff.manualShifts[dateStr];
        delete staff.isCustomInput[dateStr];
        return;
      }
      staff.manualShifts[dateStr] = value;
      if (isCustom) staff.isCustomInput[dateStr] = true;
      else delete staff.isCustomInput[dateStr];
    }

    function handlePickerAction(btn) {
      if (!pickerTarget) return;
      const { staffId, dateStr } = pickerTarget;
      const staff = staffs.find(s => s.id === staffId);
      if (!staff) return;
      const kind = btn.dataset.picker;
      closeShiftPicker();

      if (kind === 'set') {
        setManualShift(staff, dateStr, btn.dataset.value, false);
      } else if (kind === 'clear') {
        setManualShift(staff, dateStr, null);
      } else if (kind === 'custom') {
        const input = prompt('シフトを入力してください（例：14-18、遅番など）', staff.manualShifts[dateStr] || '');
        if (input === null) return;
        setManualShift(staff, dateStr, input.trim(), true);
      } else if (kind === 'color') {
        openColorPicker({ type: 'cell', staffId, dateStr });
        return;
      }
      commit();
    }

    // ============================================================
    // 色の選択
    // ============================================================
    let colorTarget = null;
    const COLOR_TITLES = { cell: 'セルの色を変更', col: '列の色を変更', memo: 'メモ欄の色を変更' };

    function openColorPicker(target) {
      colorTarget = target;
      let existing = colColors[target.dateStr];
      if (target.type === 'cell') {
        const staff = staffs.find(s => s.id === target.staffId);
        existing = (staff && staff.cellColors[target.dateStr]) || existing;
      } else if (target.type === 'memo') {
        existing = memoColors[target.dateStr] || existing;
      }
      $('color-picker-input').value = existing || '#ffcccc';
      $('color-picker-title').textContent = COLOR_TITLES[target.type];
      openModal('color-picker-modal');
    }

    function applyColor(color) {
      if (!colorTarget) return;
      const { type, dateStr, staffId } = colorTarget;
      if (type === 'cell') {
        const staff = staffs.find(s => s.id === staffId);
        if (staff) {
          if (color) staff.cellColors[dateStr] = color;
          else delete staff.cellColors[dateStr];
        }
      } else {
        const map = type === 'col' ? colColors : memoColors;
        if (color) map[dateStr] = color;
        else delete map[dateStr];
      }
      closeModal('color-picker-modal', () => { colorTarget = null; });
      commit();
    }

        renderGroupManagement();

      // キーの順番を維持して名前を変更

      Object.keys(shiftReq).forEach(k => { next[k === oldName ? newName : k] = shiftReq[k]; });
      shiftReq = next;
      staffs.forEach(s => { if (s.group === oldName) s.group = newName; });

      staffs.forEach(s => { if (s.group === name) s.group = ''; });

    // ============================================================
    // シフト生成（Web Worker で実行し、画面を固めない）
    // ============================================================
    let worker = null;
    let workerUnavailable = false;

    function getWorker() {
      if (workerUnavailable) return null;
      if (worker) return worker;
      try {
        const src = GEN_SRC + `
          self.onmessage = e => {
            const result = runGenerator(e.data, p => self.postMessage({ type: 'progress', p }));
            self.postMessage({ type: 'done', result });
          };`;
        worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
        return worker;
      } catch (e) {
        console.warn('Web Worker が使えないため、メインスレッドで生成します', e);
        workerUnavailable = true;
        return null;
      }
    }

    function runGenerationAsync(input, onProgress) {
      const runOnMainThread = () => new Promise(resolve => {
        setTimeout(() => resolve(Gen.runGenerator(input, null)), 30);
      });
      const w = getWorker();
      if (!w) return runOnMainThread();

      return new Promise((resolve, reject) => {
        w.onmessage = e => {
          if (e.data.type === 'progress') onProgress(e.data.p);
          else resolve(e.data.result);
        };
        w.onerror = err => {
          if (err.preventDefault) err.preventDefault();
          console.warn('Worker でエラーが発生したため、メインスレッドで再実行します', err);
          w.terminate();
          worker = null;
          workerUnavailable = true;
          runOnMainThread().then(resolve, reject);
        };
        w.postMessage(input);
      });
    }

    function buildGeneratorInput(year, month) {
      const { days, weekendsOnlyCount, firstDayOfWeek } = buildCalendarDays(year, month);
      const prevLen = Math.max(6, firstDayOfWeek);
      const prevDates = [];
      for (let i = prevLen; i > 0; i--) prevDates.push(toDateStr(new Date(year, month, 1 - i)));

      return {
        days: days.map(({ dateStr, dayOfWeek, weekNumber, isWeekend, isNightShiftDay }) =>
          ({ dateStr, dayOfWeek, weekNumber, isWeekend, isNightShiftDay })),
        staffs: staffs.map(s => ({
          id: s.id,
          name: s.name,
          type: s.type,
          group: s.group || '',
          needsFollowUp: !!s.needsFollowUp,
          offPreference: s.offPreference || '',
          manual: days.map(d => s.manualShifts[d.dateStr] || null),
          prev: prevDates.map(ds => {
            const v = getActualShift(s, ds);
            return v ? (isOffVal(v) ? '休' : v) : null;
          }),
        })),
        shiftReq: JSON.parse(JSON.stringify(shiftReq)),
        firstDayOfWeek,
        weekendsOnlyCount,
      };
    }

    function setGenerateButton(label) {
      const btn = $('btn-generate');
      btn.disabled = !!label;
      $('btn-generate-content').innerHTML = label
        ? `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> ${label}`
        : `<i data-lucide="play" class="w-4 h-4"></i> シフト生成`;
      refreshIcons();
    }

    async function generateShift() {
      if (isGenerating) return;
      if (staffs.length === 0) { showToast('先に社員を追加してください'); return; }
      isGenerating = true;
      closeShiftPicker();

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      setGenerateButton('生成中… 0%');
      try {
        const result = await runGenerationAsync(buildGeneratorInput(year, month),
          p => setGenerateButton(`生成中… ${Math.round(p * 100)}%`));
        Object.assign(generatedShifts, result.shift);
        lastViolations[monthKey(year, month)] = result.violations;
        commit();
        renderViolationBadge();
        if (result.violations.length > 0) showViolations(year, month);
        else showToast('✓ すべての必須条件を満たすシフトを生成しました');
      } catch (e) {
        console.error(e);
        alert('シフト生成中にエラーが発生しました。');
      } finally {
        isGenerating = false;
        setGenerateButton(null);
      }
    }

    // ============================================================
    // 生成結果のチェック表示
    // ============================================================
    function renderViolationBadge() {
      const list = lastViolations[monthKey(currentDate.getFullYear(), currentDate.getMonth())];
      const btn = $('btn-violations');
      if (list && list.length > 0) {
        $('btn-violations-count').textContent = `${list.length}件`;
        btn.classList.remove('hidden');
      } else {
        btn.classList.add('hidden');
      }
    }

    function showViolations(year, month) {
      const list = lastViolations[monthKey(year, month)] || [];
      const byType = {};
      list.forEach(v => { (byType[v.type] = byType[v.type] || []).push(v.text); });
      $('result-modal-title').textContent = `${year}年${month + 1}月：守れなかった条件（${list.length}件）`;
      $('result-modal-list').innerHTML = Object.keys(byType).map(type => `
        <div>
          <div class="text-xs font-bold text-red-700 mb-1">${esc(type)}（${byType[type].length}件）</div>
          <ul class="text-xs text-slate-700 space-y-0.5 pl-3 list-disc">
            ${byType[type].map(t => `<li>${esc(t)}</li>`).join('')}
          </ul>
        </div>`).join('');
      openModal('result-modal');
    }

    function clearGeneratedMonth() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      if (!confirm(`${year}年${month + 1}月の自動生成されたシフトをクリアしますか？\n（手動で入力した希望休や固定シフトはそのまま残ります）`)) return;
      const prefix = `${monthKey(year, month)}-`;
      Object.keys(generatedShifts).forEach(ds => { if (ds.startsWith(prefix)) delete generatedShifts[ds]; });
      delete lastViolations[monthKey(year, month)];
      renderViolationBadge();
      commit();
    }

    // ============================================================
    // 初期化
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      loadData();

      $('input-staff-type').innerHTML = STAFF_TYPES.map(t => `<option value="${t}">${t}</option>`).join('');
      $('color-palette').innerHTML = COLOR_PALETTE.map(([hex, name]) =>
        `<button data-color="${hex}" class="w-10 h-10 rounded-full shadow-sm border border-slate-200 hover:scale-110 hover:border-indigo-400 transition-all cursor-pointer" style="background-color:${hex};" title="${name}"></button>`).join('');

      renderAddFormGroup();
      renderShiftReqForms();
      setupTableEvents();
      setupReqFormEvents();
      setupGroupEvents();
      setupStaffModalEvents();

      // 月移動
      $('btn-prev-month').addEventListener('click', () => changeMonth(-1));
      $('btn-next-month').addEventListener('click', () => changeMonth(1));
      $('btn-current-month').addEventListener('click', () => setMonth(new Date().getFullYear(), new Date().getMonth()));
      $('month-display').addEventListener('click', e => { e.stopPropagation(); toggleMonthPicker(); });
      $('month-picker-popup').addEventListener('click', e => {
        e.stopPropagation();
        const yearBtn = e.target.closest('[data-year-delta]');
        if (yearBtn) { pickerYear += Number(yearBtn.dataset.yearDelta); renderMonthPickerGrid(); return; }
        const monthBtn = e.target.closest('[data-month]');
        if (monthBtn) { setMonth(pickerYear, Number(monthBtn.dataset.month)); closeMonthPicker(); }
      });

      // ボタン類
      $('btn-add-staff').addEventListener('click', addStaff);
      $('input-staff-name').addEventListener('keydown', e => { if (e.key === 'Enter') addStaff(); });
      $('btn-generate').addEventListener('click', generateShift);
      $('btn-clear').addEventListener('click', clearGeneratedMonth);
      $('btn-violations').addEventListener('click', () => showViolations(currentDate.getFullYear(), currentDate.getMonth()));
      $('btn-open-req').addEventListener('click', () => { renderShiftReqForms(); openModal('shift-req-modal'); });
      $('btn-open-staff').addEventListener('click', () => { renderGroupManagement(); renderStaffModal(); openModal('staff-modal'); });
      $('btn-night-save').addEventListener('click', () => setNightShift({
        startDate: selectedNightShiftDate,
        cycle: parseInt($('night-shift-cycle-select').value, 10),
      }));
      $('btn-night-clear').addEventListener('click', () => setNightShift({ startDate: null, cycle: null }));
      $('btn-color-save').addEventListener('click', () => applyColor($('color-picker-input').value));
      $('btn-color-clear').addEventListener('click', () => applyColor(null));
      $('color-palette').addEventListener('click', e => {
        const b = e.target.closest('[data-color]');
        if (b) applyColor(b.dataset.color);
      });
      $('shift-picker').addEventListener('click', e => {
        e.stopPropagation();
        const b = e.target.closest('[data-picker]');
        if (b) handlePickerAction(b);
      });

      // モーダルを閉じる（×ボタン・背景クリック）
      document.querySelectorAll('[data-close-modal]').forEach(btn =>
        btn.addEventListener('click', () => closeModal(btn.dataset.closeModal)));
      ['shift-req-modal', 'staff-modal', 'night-shift-modal', 'color-picker-modal', 'result-modal'].forEach(id => {
        $(id).addEventListener('click', e => { if (e.target.id === id) closeModal(id); });
      });

      // ポップアップの外側クリック・Esc・スクロールで閉じる
      document.addEventListener('click', e => {
        if (!$('staff-summary-popup').contains(e.target)) hideStaffSummary();
        if (!$('shift-picker').contains(e.target)) closeShiftPicker();
        if (isMonthPickerOpen && !$('month-picker-popup').contains(e.target)) closeMonthPicker();
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { closeShiftPicker(); hideStaffSummary(); }
      });
      window.addEventListener('scroll', () => { closeShiftPicker(); hideStaffSummary(); }, true);

      renderMonthHeader();
      renderTable();
      refreshIcons();
    });
  </script>
</body>
</html>
